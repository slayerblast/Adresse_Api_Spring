spring.application.name=projet

# API REST
spring.main.web-application-type=servlet

# Desactive le lancement automatique du job au demarrage
spring.batch.job.enabled=false

# Initialise automatiquement le schema de metadonnees Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=always

#### VEUILLEZ COMMENTER LA BASE QUI N'EST PAS UTILISE ###

# -------------------------
# SQLite
# -------------------------
spring.profiles.active=sqlite
spring.datasource.url=jdbc:sqlite:adresse.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.schema-locations=classpath:schema_sqlite.sql
spring.datasource.hikari.maximum-pool-size=1

